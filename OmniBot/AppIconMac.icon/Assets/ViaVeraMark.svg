<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Via Vera friendly mark</title>
  <desc id="description">A friendly terminal character with a winking eye, a round eye, a smile, and a soft ear.</desc>

  <g
    id="character-outline"
    fill="none"
    stroke="#000000"
    stroke-width="78"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M 716 245 A 350 350 0 1 0 831 657" />
  </g>

  <g id="friendly-ear" transform="rotate(12 842 448)">
    <ellipse cx="842" cy="448" rx="65" ry="116" fill="#000000" />
    <path
      d="M 824 394 C 858 405 872 440 857 471 C 848 489 834 501 816 509"
      fill="none"
      stroke="#ffffff"
      stroke-width="28"
      stroke-linecap="round"
    />
  </g>

  <g id="friendly-terminal-face" fill="none" stroke="#000000" stroke-linecap="round">
    <path d="M 397 433 Q 450 484 500 512 Q 450 540 397 591" stroke-width="72" stroke-linejoin="round" />
    <circle cx="650" cy="483" r="35" fill="#000000" stroke="none" />
    <path d="M 568 603 Q 630 642 692 603" stroke-width="58" />
  </g>
</svg>
